# Postgres only, for `npm run dev` on your machine:
#   docker compose -f docker-compose.local.yml up -d
#   npm run db:migrate && npm run dev
# Matches DATABASE_URL=postgres://qr:qrlocal@localhost:5432/qr in .env.example.
name: qr-web-local

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qr
      POSTGRES_DB: qr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qrlocal}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qr -d qr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata-local:
